<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活动签到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .activity-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .activity-info p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .activity-info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📝</div>
            <h1>活动签到</h1>
            <p id="statusText">正在验证二维码...</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <div id="activityInfo" class="activity-info">
            <p><strong>活动ID:</strong> <span id="activityId">-</span></p>
        </div>

        <form id="checkinForm" style="display: none;">
            <div class="form-group">
                <label for="phone">报名手机号</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="请输入您报名时使用的手机号" 
                    pattern="[0-9]{11}"
                    maxlength="11"
                    required
                >
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">立即签到</span>
            </button>
        </form>
    </div>

    <script>
        // 配置
        const API_BASE_URL = "http://localhost:8080";
        
        // 从 URL 获取 token
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // 页面元素
        const alertBox = document.getElementById('alertBox');
        const statusText = document.getElementById('statusText');
        const checkinForm = document.getElementById('checkinForm');
        const activityInfo = document.getElementById('activityInfo');
        const activityIdEl = document.getElementById('activityId');
        const phoneInput = document.getElementById('phone');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        // 显示提示框
        function showAlert(message, type = 'info') {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // 验证 Token
        async function validateToken() {
            if (!token) {
                statusText.textContent = '二维码无效';
                showAlert('缺少签到二维码，请重新扫描', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/h5/checkin/validate?token=${token}`);
                const result = await response.json();

                if (result.code === 200 && result.data.valid) {
                    // Token 有效，显示签到表单
                    statusText.textContent = '请输入手机号完成签到';
                    activityIdEl.textContent = result.data.activityId;
                    activityInfo.style.display = 'block';
                    checkinForm.style.display = 'block';
                    showAlert('二维码验证成功，请输入手机号', 'success');
                } else {
                    statusText.textContent = '二维码已失效';
                    showAlert(result.message || '二维码已失效，请联系工作人员刷新', 'error');
                }
            } catch (error) {
                console.error('验证失败:', error);
                statusText.textContent = '验证失败';
                showAlert('网络错误，请检查后端服务是否启动', 'error');
            }
        }

        // 提交签到
        checkinForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = phoneInput.value.trim();
            
            // 验证手机号
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showAlert('请输入正确的11位手机号', 'error');
                return;
            }

            // 禁用按钮，显示加载状态
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span>签到中...';

            try {
                const response = await fetch(`${API_BASE_URL}/h5/checkin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        checkInToken: token,
                        studentPhone: phone
                    })
                });

                const result = await response.json();

                if (result.code === 200) {
                    showAlert('签到成功！', 'success');
                    statusText.textContent = '签到成功';
                    btnText.textContent = '已完成签到';
                    phoneInput.disabled = true;
                    
                    // 3秒后可以重新尝试（以防误操作）
                    setTimeout(() => {
                        submitBtn.disabled = false;
                        btnText.textContent = '再次签到';
                    }, 3000);
                } else {
                    showAlert(result.message || '签到失败，请重试', 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = '立即签到';
                }
            } catch (error) {
                console.error('签到失败:', error);
                showAlert('网络错误，请重试', 'error');
                submitBtn.disabled = false;
                btnText.textContent = '立即签到';
            }
        });

        // 页面加载时验证 Token
        validateToken();
    </script>
</body>
</html>

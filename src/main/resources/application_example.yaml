spring:
  application:
    name: activities
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://<your mysql host>/activities_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8&allowMultiQueries=true
    username: <your mysql username>
    password: <your mysql password>
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 12
      minimum-idle: 10
      pool-name: SPHHikariPool
  servlet:
    multipart:
      max-file-size: 50MB # 传输文件大小配置
  data:
    redis:
      host: <your redis host>
      password: <your redis password>
      port: 6379
      database: 0

# mybatis配置
mybatis:
  mapper-locations: classpath:mapper/**.xml
  configuration:
    map-underscore-to-camel-case: true
    lazy-loading-enabled: true

# 日志配置
logging:
  level:
    com:
      xidian:
        activities:
          mapper: debug

# java后端端口
server:
  port: 8080

# JWT配置
jwt:
  secret: mySecretKey123456789012345678901234567890  # 至少32位
  expiration: 3600  # 过期时间（秒）
  token-head: "Bearer "  # 令牌头

# minio图片存储配置
minio:
  endpoint: http://<your minio host>:9000
  access-key: <your minio access key>
  secret-key: <your minio secret key>
  bucket-name: activities

# springdoc-openapi配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.xidian.activities.controller

ai:
  siliconflow:
    api-key: YOUR_API_KEY_HERE  # 在 https://cloud.siliconflow.cn/ 获取
    api-url: https://api.siliconflow.cn/v1/images/generations
    model: black-forest-labs/FLUX.1-schnell